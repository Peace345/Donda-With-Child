<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donda: With Child</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    #player {
      padding: 20px;
    }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

    .song {
      padding: 10px;
      margin: 5px auto;
      width: 60%;
      background: #222;
      cursor: pointer;
      border-radius: 5px;
    }

    .song:hover {
      background: #333;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="player">

  <!-- BACK BUTTON -->
  <button onclick="goBack()">⬅ Back to Library</button>

  <!-- ALBUM INFO -->
  <h1 id="albumTitle">Donda: With Child</h1>
  <img id="cover" src="" alt="cover">

  <!-- SONG LIST -->
  <div id="songs"></div>

</div>

<audio id="audio"></audio>

<button id="playPauseBtn" onclick="togglePlay()">▶️ Play</button>

<script>

let currentAlbum = {
  name: "Donda: With Child",
  cover: "dondawithchildcover.jpg",
  songs: [
      { file: "precious.mp3", title: "Precious", artist: "Kanye West, Dem Jointz" },
      { file: "bloodofthelamb.mp3", title: "Blood Of The Lambs", artist: "Kanye West, Pusha T" },
      { file: "feelaway.mp3", title: "Feel A Way", artist: "Kanye West" },
      { file: "whathasamericadoneforme.mp3", title: "What Has America Done For Me", artist: "Kanye West, Consequence" },
      { file: "duranduran.mp3", title: "Duran Duran", artist: "Kanye West" },
      { file: "godgotme.mp3", title: "God Got Me", artist: "Kanye West" },
      {
        title: "Future Sounds",
        versions: [
      {
        version: "V29",
        file: "futuresounds.mp3",
        artist: "Kanye West, Travis Scott, Harmony"
      },
      {
        version: "V30",
        file: "futuresoundsv30.mp3",
        artist: "Kanye West, Travis Scott, Sunday Service Choir"
      },
    ]
  },
      { file: "welcometomylife.mp3", title: "Welcome To My Life", artist: "Kanye West, Ty Dolla $ign" },
      { file: "byyourside.mp3", title: "By Your Side", artist: "Kanye West, Frank Ocean" },
      { file: "24.mp3", title: "24", artist: "Kanye West, KayCyy" },
      { file: "karatekid.mp3", title: "Karate Kid", artist: "Kanye West" },
      { file: "believewhatisaykaycyysversion.mp3", title: "Believe What I Say", artist: "Kanye West, KayCyy" },
      { file: "headshot.mp3", title: "Headshot", artist: "Kanye West, Playboi Carti" },
      { file: "babyimyours.mp3", title: "Baby I'm Yours", artist: "Kanye West" },
      { file: "iknowgodbreathedonthisv26.mp3", title: "God Breathed", artist: "Kanye West" },
      {
        title: "Life Of The Party",
        versions: [
      {
        version: "V4",
        file: "lifeofthepartyv4.mp3",
        artist: "Kanye West"
      },
      {
        version: "V5",
        file: "lifeofthepartyv5.mp3",
        artist: "Kanye West, Pusha T"
      },
      {
        version: "V7",
        file: "lifeofthepartyv7.mp3",
        artist: "Kanye West"
      },
      {
        version: "V8",
        file: "lifeofthepartyv8.mp3",
        artist: "Kanye West"
      },
    ]
  },
      { file: "wakethedeaddondaversion.mp3", title: "Wake The Dead", artist: "Kanye West" },
      { file: "madeit.mp3", title: "Made It", artist: "Kanye West" },
      { file: "aliendondaversion.mp3", title: "Alien", artist: "Kanye West, Ant Clemons, Kid Cudi, 2 Chainz, Quavo, Pusha T, Jaden" },
      { file: "lamonsterdondawithchildver.mp3", title: "LA Monster", artist: "Kanye West" },
      { file: "visitationrights.mp3", title: "Visitation Rights", artist: "Kanye West, Consequence" },
      { file: "southcarolina.mp3", title: "South Carolina", artist: "Kanye West, Pusha T, The WRLDFMS Tony Williams, Stalone" },
      { file: "godstest.mp3", title: "God's Test", artist: "Kanye West, KayCyy, 2 Chainz" },
      { file: "cityoflostangels.mp3", title: "City of Lost Angels", artist: "Kanye West" }
  ]
};

// BACK BUTTON
function goBack() {
  window.location.href = "https://peace345.github.io/Ye-Unreleased-Archive/";
}


// VARIABLES
let currentIndex = 0;
let currentVersionIndex = null;


// LOAD ALBUM
document.getElementById("albumTitle").innerText = currentAlbum.name;
document.getElementById("cover").src = currentAlbum.cover;


// BUILD SONG LIST
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {

    // SONG WITH MULTIPLE VERSIONS
    if (song.versions) {

      const group = document.createElement("div");
      group.className = "song";

      group.innerHTML = `<strong>${song.title} ▼</strong>`;

      group.onclick = () => {

        // Prevent duplicates
        if (group.dataset.opened) return;
        group.dataset.opened = true;

        song.versions.forEach((version, versionIndex) => {

          const div = document.createElement("div");
          div.className = "song";

          div.innerHTML = `
            <div style="display:flex; align-items:center;">
              <div style="width:60px;">
                <strong>${version.version}</strong>
              </div>

              <div style="flex:1; text-align:center;">
                <strong>${song.title}</strong><br>
                <small>${version.artist}</small>
              </div>
            </div>
          `;

          div.onclick = (e) => {
            e.stopPropagation();

            currentIndex = i;
            currentVersionIndex = versionIndex;

            window.audio.src = version.file;
            window.audio.play();

            updateMediaSession({
              title: song.title,
              artist: version.artist
            });
          };

          group.after(div);
        });

      };

      songsDiv.appendChild(group);

    }

    // NORMAL SONG
    else {

      const div = document.createElement("div");
      div.className = "song";

      div.innerHTML = `
        <strong>${song.title}</strong><br>
        <small>${song.artist || ""}</small>
      `;

      div.onclick = () => playSong(i);

      songsDiv.appendChild(div);
    }

  });
}


// PLAY SONG
function playSong(i, versionIndex = null) {

  currentIndex = i;

  const song = currentAlbum.songs[i];

  // VERSION GROUP
  if (song.versions) {

    // Start with the LOWEST version.
    // Your array is highest → lowest,
    // so the lowest version is the LAST item.
    if (versionIndex === null) {
      versionIndex = song.versions.length - 1;
    }

    currentVersionIndex = versionIndex;

    const version = song.versions[versionIndex];

    window.audio.src = version.file;
    window.audio.play();

    updateMediaSession({
      title: song.title,
      artist: version.artist
    });

    return;
  }


  // NORMAL SONG
  currentVersionIndex = null;

  window.audio.src = song.file;
  window.audio.play();

  updateMediaSession(song);
}


// MEDIA SESSION
function updateMediaSession(song) {

  if (!("mediaSession" in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      {
        src: currentAlbum.cover,
        sizes: "512x512",
        type: "image/jpeg"
      }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    window.audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    window.audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {

    if (!currentAlbum) return;

    // If currently playing a version, go to the previous version
    if (
      currentVersionIndex !== null &&
      currentVersionIndex > 0
    ) {
      playSong(currentIndex, currentVersionIndex - 1);
      return;
    }

    // Otherwise go to previous album track
    if (currentIndex > 0) {
      playSong(currentIndex - 1);
    } else {
      playSong(currentAlbum.songs.length - 1);
    }
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {

    if (!currentAlbum) return;

    const song = currentAlbum.songs[currentIndex];

    // If playing a version, go to the next version
    if (
      song.versions &&
      currentVersionIndex !== null &&
      currentVersionIndex < song.versions.length - 1
    ) {
      playSong(currentIndex, currentVersionIndex + 1);
      return;
    }

    // Otherwise go to next album track
    if (currentIndex < currentAlbum.songs.length - 1) {
      playSong(currentIndex + 1);
    } else {
      playSong(0);
    }
  });
}


// PLAY / PAUSE BUTTON
function togglePlay() {

  if (window.audio.paused) {
    window.audio.play();
  } else {
    window.audio.pause();
  }
}


// INITIALIZE AUDIO
window.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("audio");

  // Make audio available to the rest of the script
  window.audio = audio;


  // PLAY BUTTON UI
  audio.addEventListener("play", () => {
    document.getElementById("playPauseBtn").innerText = "⏸️ Pause";
  });


  // PAUSE BUTTON UI
  audio.addEventListener("pause", () => {
    document.getElementById("playPauseBtn").innerText = "▶️ Play";
  });


  // AUTOPLAY THROUGH ALBUM
  audio.addEventListener("ended", () => {

    if (!currentAlbum) return;

    const song = currentAlbum.songs[currentIndex];


    // VERSION GROUP
    if (
      song.versions &&
      currentVersionIndex !== null
    ) {

      // Your versions are stored:
      // V6 → V5 → V4 → V1
      //
      // So autoplay moves backward through the array:
      // V1 → V4 → V5 → V6

      const nextVersion = currentVersionIndex - 1;

      if (nextVersion >= 0) {
        playSong(currentIndex, nextVersion);
        return;
      }
    }


    // FINISHED ALL VERSIONS
    // Move to the next album track
    if (currentIndex < currentAlbum.songs.length - 1) {
      playSong(currentIndex + 1);
    } else {
      // End of album → restart album
      playSong(0);
    }

  });


  // BUILD THE SONG LIST
  buildSongs();

});

</script>

</body>
</html>
