<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donda: With Child</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    #player {
      padding: 20px;
    }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

    .song {
      padding: 10px;
      margin: 5px auto;
      width: 60%;
      background: #222;
      cursor: pointer;
      border-radius: 5px;
    }

    .song:hover {
      background: #333;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="player">

  <!-- BACK BUTTON -->
  <button onclick="goBack()">⬅ Back to Library</button>

  <!-- ALBUM INFO -->
  <h1 id="albumTitle">Donda: With Child</h1>
  <img id="cover" src="" alt="cover">

  <!-- SONG LIST -->
  <div id="songs"></div>

</div>

<audio id="audio"></audio>

<button id="playPauseBtn" onclick="togglePlay()">▶️ Play</button>

<script>

let currentAlbum = {
  name: "Donda: With Child",
  cover: "dondawithchildcover.jpg",
  songs: [
      { file: "precious.mp3", title: "Precious", artist: "Kanye West, Dem Jointz" },
      { file: "bloodofthelamb.mp3", title: "Blood Of The Lambs", artist: "Kanye West, Pusha T" },
      { file: "feelaway.mp3", title: "Feel A Way", artist: "Kanye West" },
      { file: "whathasamericadoneforme.mp3", title: "What Has America Done For Me", artist: "Kanye West, Consequence" },
      { file: "duranduran.mp3", title: "Duran Duran", artist: "Kanye West" },
      { file: "godgotme.mp3", title: "God Got Me", artist: "Kanye West" },
      {
        title: "Future Sounds",
        versions: [
      {
        version: "V30",
        file: "futuresoundsv30.mp3",
        artist: "Kanye West, Travis Scott, Sunday Service Choir"
      },
      {
        version: "V29",
        file: "futuresounds.mp3",
        artist: "Kanye West, Travis Scott, Harmony"
      }
    ]
  },
      { file: "welcometomylife.mp3", title: "Welcome To My Life", artist: "Kanye West, Ty Dolla $ign" },
      { file: "byyourside.mp3", title: "By Your Side", artist: "Kanye West, Frank Ocean" },
      { file: "24.mp3", title: "24", artist: "Kanye West, KayCyy" },
      { file: "karatekid.mp3", title: "Karate Kid", artist: "Kanye West" },
      { file: "believewhatisaykaycyysversion.mp3", title: "Believe What I Say", artist: "Kanye West, KayCyy" },
      { file: "headshot.mp3", title: "Headshot", artist: "Kanye West, Playboi Carti" },
      { file: "babyimyours.mp3", title: "Baby I'm Yours", artist: "Kanye West" },
      { file: "iknowgodbreathedonthisv26.mp3", title: "God Breathed", artist: "Kanye West" },
      {
        title: "Life Of The Party",
        versions: [
      {
        version: "V8",
        file: "lifeofthepartyv8.mp3",
        artist: "Kanye West"
      },
      {
        version: "V7",
        file: "lifeofthepartyv7.mp3",
        artist: "Kanye West"
      },
      {
        version: "V5",
        file: "lifeofthepartyv5.mp3",
        artist: "Kanye West, Pusha T"
      },
      {
        version: "V4",
        file: "lifeofthepartyv4.mp3",
        artist: "Kanye West"
      }
    ]
  },
      { file: "wakethedeaddondaversion.mp3", title: "Wake The Dead", artist: "Kanye West" },
      { file: "madeit.mp3", title: "Made It", artist: "Kanye West" },
      { file: "aliendondaversion.mp3", title: "Alien", artist: "Kanye West, Ant Clemons, Kid Cudi, 2 Chainz, Quavo, Pusha T, Jaden" },
      { file: "lamonsterdondawithchildver.mp3", title: "LA Monster", artist: "Kanye West" },
      { file: "visitationrights.mp3", title: "Visitation Rights", artist: "Kanye West, Consequence" },
      { file: "southcarolina.mp3", title: "South Carolina", artist: "Kanye West, Pusha T, Tony Williams, Stalone" },
      { file: "godstest.mp3", title: "God's Test", artist: "Kanye West, KayCyy, 2 Chainz" },
      { file: "cityoflostangels.mp3", title: "City of Lost Angels", artist: "Kanye West" }
  ]
};

// BACK BUTTON (PUT MAIN REPO LINK HERE)
function goBack() {
  window.location.href = "https://peace345.github.io/Ye-Unreleased-Archive/"; // <-- paste main library repo URL here
}

// LOAD ALBUM
document.getElementById("albumTitle").innerText = currentAlbum.name;
document.getElementById("cover").src = currentAlbum.cover;

buildSongs();

// BUILD SONG LIST
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {

    // SONG WITH MULTIPLE VERSIONS
    if (song.versions) {

      const group = document.createElement("div");
      group.className = "song";

      group.innerHTML = `<strong>${song.title} ▼</strong>`;

      group.onclick = () => {

        // prevent duplicates
        if (group.dataset.opened) return;
        group.dataset.opened = true;

        song.versions.forEach(version => {

          const div = document.createElement("div");
          div.className = "song";

          div.innerHTML = `
            <div style="display:flex; align-items:center;">
              <div style="width:60px;">
                <strong>${version.version}</strong>
              </div>

              <div style="flex:1; text-align:center;">
                <strong>${song.title}</strong><br>
                <small>${version.artist}</small>
              </div>
            </div>
          `;

          div.onclick = (e) => {
            e.stopPropagation();

            window.audio.src = version.file;
            window.audio.play();

            updateMediaSession({
              title: song.title,
              artist: version.artist
            });
          };

          group.after(div);

        });

      };

      songsDiv.appendChild(group);

    }

    // NORMAL SONG
    else {

      const div = document.createElement("div");
      div.className = "song";

      div.innerHTML = `
        <strong>${song.title}</strong><br>
        <small>${song.artist || ""}</small>
      `;

      div.onclick = () => playSong(i);

      songsDiv.appendChild(div);

    }

  });

}

// PLAY SONG
function playSong(i) {

  // Skip version groups
  while (
    i < currentAlbum.songs.length &&
    currentAlbum.songs[i].versions
  ) {
    i++;
  }

  // Loop back to beginning if needed
  if (i >= currentAlbum.songs.length) {
    i = 0;

    while (
      i < currentAlbum.songs.length &&
      currentAlbum.songs[i].versions
    ) {
      i++;
    }
  }

  currentIndex = i;

  const song = currentAlbum.songs[i];

  window.audio.src = song.file;
  window.audio.play();

  updateMediaSession(song, currentAlbum);
}

function updateMediaSession(song) {
  if (!('mediaSession' in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      { src: currentAlbum.cover, sizes: "512x512", type: "image/jpg" }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex - 1 + currentAlbum.songs.length) % currentAlbum.songs.length;
    playSong(currentIndex);
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex + 1) % currentAlbum.songs.length;
    playSong(currentIndex);
  });
}

  if ("mediaSession" in navigator) {

  navigator.mediaSession.setActionHandler("play", async () => {
    await audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

}

function togglePlay() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

  audio.addEventListener("play", () => {
  document.getElementById("playPauseBtn").innerText = "⏸️ Pause";
});

audio.addEventListener("pause", () => {
  document.getElementById("playPauseBtn").innerText = "▶️ Play";
});

window.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("audio");

  audio.addEventListener("ended", () => {
  if (!currentAlbum) return;

  const list = getPlayableSongs();

  const currentSong = currentAlbum.songs[currentIndex];
  const nextIndex = list.indexOf(currentSong) + 1;

  if (nextIndex < list.length) {
    const nextSong = list[nextIndex];

    const realIndex = currentAlbum.songs.indexOf(nextSong);
    playSong(realIndex);
  } else {
    playSong(currentAlbum.songs.indexOf(list[0]));
  }
});

  // expose audio globally so playSong can use it safely
  window.audio = audio;
});

function getPlayableSongs() {
  const list = [];

  currentAlbum.songs.forEach(song => {
    if (song.versions) {
      // skip the container entirely
      return;
    }
    list.push(song);
  });

  return list;
}
  
</script>

</body>
</html>
